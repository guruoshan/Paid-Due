name: Paid-Due repair branch validation

on:
  push:
    branches:
      - fix/backend-compatibility-audit-2026-10
  pull_request:

permissions:
  contents: read

concurrency:
  group: paid-due-android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build-and-unit-tests:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Use Android SDK preinstalled on the GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Run unit tests with inbound apply explicitly enabled
        env:
          PAID_DUE_APPLY_INBOUND_FINANCIAL_ENVELOPES: "true"
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      
      - name: Compile Android instrumentation tests
        run: ./gradlew --no-daemon :app:compileDebugAndroidTestKotlin

      - name: Enable KVM access for the GitHub-hosted emulator
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo 'WARNING: /dev/kvm is not available; emulator may use software acceleration.'
          fi

      - name: Run Android instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-load -no-snapshot-save -gpu swiftshader_indirect
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Collect emulator diagnostics after instrumentation failure
        if: failure()
        run: |
          echo '--- ADB device state ---'
          adb devices -l || true
          echo '--- KVM state ---'
          ls -l /dev/kvm || true
          echo '--- AVD configuration ---'
          ls -la "$HOME/.android/avd" || true
          find "$HOME/.android" "$RUNNER_TEMP" -maxdepth 4 -type f \\( -iname '*emulator*.log' -o -iname '*adb*.log' \\) -print -exec tail -n 100 {} \\; 2>/dev/null || true

