name: Android PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  debug-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Start isolated Android API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name paid-due-api36 --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd paid-due-api36 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/paid-due-emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "$booted" == "1" ]]; then break; fi
            sleep 5
          done
          [[ "${booted:-}" == "1" ]] || {
            cat "$RUNNER_TEMP/paid-due-emulator.log"
            echo "::error::Android emulator did not finish booting."
            exit 1
          }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run unit tests, instrumentation tests, and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:connectedDebugAndroidTest :app:assembleDebug
