name: Android PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  debug-build-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Compile debug Kotlin
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Run debug unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Generate and verify Room schema v14
        run: |
          ./gradlew --no-daemon --stacktrace :app:kspDebugKotlin
          test -s app/schemas/com.dailymoneyregister.core.database.DmrDatabase/14.json
          grep -q '"version": 14' app/schemas/com.dailymoneyregister.core.database.DmrDatabase/14.json

      - name: Run Room migration instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          script: |
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.dailymoneyregister.FinancialSyncOutboxV13Test


      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: paid-due-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
# Re-trigger CI to collect Room migration evidence.
