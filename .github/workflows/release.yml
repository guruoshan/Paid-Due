name: Android signed release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-main-install-ready
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Deno for Edge Function contract tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Start isolated Android API 36 emulator for instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name paid-due-api36 --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2 --force
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd paid-due-api36 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto \
            > "$RUNNER_TEMP/paid-due-emulator.log" 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            echo "::error::Android emulator never registered with adb."
            cat "$RUNNER_TEMP/paid-due-emulator.log" || true
            ps -ef | grep '[e]mulator' || true
            exit 1
          fi
          for attempt in $(seq 1 90); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "$booted" == "1" ]]; then break; fi
            sleep 5
          done
          [[ "${booted:-}" == "1" ]] || {
            cat "$RUNNER_TEMP/paid-due-emulator.log"
            echo "::error::Android emulator did not finish booting."
            exit 1
          }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run Android financial-validation unit and instrumentation tests plus release compilation before signing
        env:
          PAID_DUE_APPLY_INBOUND_FINANCIAL_ENVELOPES: "true"
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:connectedDebugAndroidTest :app:compileReleaseKotlin

      - name: Run Supabase Edge Function contract tests before signing
        working-directory: supabase/functions/api
        run: deno task test api_test.ts

      - name: Run staff invitation URL security contract tests before signing
        run: deno test supabase/functions/staff-invite/invite-link_test.ts

      - name: Validate required release configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ vars.EXPECTED_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub secret/variable $name is not configured."
              exit 1
            fi
          done
          normalized="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$normalized" =~ ^[0-9A-F]{64}$ ]] || {
            echo "::error::EXPECTED_SHA256 must be a 64-character SHA-256 certificate fingerprint."
            exit 1
          }

      - name: Decode release keystore to runner temporary storage
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/paid-due-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          echo "KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          unset KEYSTORE_BASE64

      - name: Build signed release APK and Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PAID_DUE_APPLY_INBOUND_FINANCIAL_ENVELOPES: "true"
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Delete temporary release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/paid-due-release.jks"

      - name: Verify release signatures and prepare artifacts
        shell: bash
        env:
          EXPECTED_SHA256: ${{ vars.EXPECTED_SHA256 }}
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab_path="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk_path" && test -s "$apk_path"
          test -n "$aab_path" && test -s "$aab_path"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          signer_output="$("$apksigner" verify --verbose --print-certs "$apk_path")"
          printf '%s\n' "$signer_output"
          actual="$(printf '%s\n' "$signer_output" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" =~ ^[0-9A-F]{64}$ ]] || { echo "::error::Could not read APK signer SHA-256 digest."; exit 1; }
          [[ "$actual" == "$expected" ]] || { echo "::error::APK signing certificate does not match EXPECTED_SHA256."; exit 1; }

          jarsigner -verify "$aab_path"
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          cp "$apk_path" "$RUNNER_TEMP/paid-due-${tag}.apk"
          cp "$aab_path" "$RUNNER_TEMP/paid-due-${tag}.aab"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Upload APK and AAB build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paid-due-release-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/paid-due-v1.0.${{ github.run_number }}.apk
            ${{ runner.temp }}/paid-due-v1.0.${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/paid-due-$RELEASE_TAG.apk" \
            "$RUNNER_TEMP/paid-due-$RELEASE_TAG.aab" \
            --target "$GITHUB_SHA" \
            --title "Paid&Due $RELEASE_TAG" \
            --notes "Automated main-branch release. APK signature was verified against the repository EXPECTED_SHA256 variable."
