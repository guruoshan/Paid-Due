name: Release audit scans (temporary)
on:
  push:
    branches:
      - audit/release-readiness-2026-10-25
    paths-ignore:
      - 'release-audit/**'
permissions:
  contents: write
concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-lint-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Android lint
        id: lint
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:lintDebug --no-daemon --stacktrace
          status=$?
          echo "lint_exit=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Write non-sensitive scan report
        if: always()
        env:
          LINT_EXIT: ${{ steps.lint.outputs.lint_exit }}
        run: |
          mkdir -p release-audit
          python3 - <<'PY' > release-audit/scan-results.md
          import os,re,glob,hashlib,collections,xml.etree.ElementTree as ET
          print("# Release audit scan results")
          print("\nGenerated by the temporary audit workflow. Candidate lists are heuristic, not proof of dead code. No secret scan is performed and no secret values are emitted.\n")
          print("## Android lint")
          print(f"- Gradle lint exit code: {os.environ.get('LINT_EXIT') or 'not recorded'}")
          xmls=glob.glob("app/build/reports/lint-results*.xml")
          counts=collections.Counter(); lint_rows=[]
          for path in xmls:
            try:
              root=ET.parse(path).getroot()
              for issue in root.findall(".//issue"):
                ident=issue.attrib.get("id","UNKNOWN")
                counts[ident]+=1
                if ident in {"UnusedResources","UnusedIds","UnusedIncludedResources","UnusedAttribute","StringFormatInvalid","MissingTranslation"}:
                  loc=issue.find("location")
                  src=(loc.attrib.get("file","path unavailable") if loc is not None else "path unavailable")
                  msg=(issue.attrib.get("message","") or "").replace("\n"," ")
                  lint_rows.append((ident,src,msg[:180]))
            except Exception as e: print(f"- Could not parse {path}: {type(e).__name__}")
          print(f"- XML lint reports: {len(xmls)}")
          print("- Counts by issue type:")
          if counts:
            for k,v in sorted(counts.items()): print(f"  - {k}: {v}")
          else: print("  - No parsed issue counts (report missing or empty).")
          print("\n### Unused resource/string lint candidates")
          if lint_rows:
            for ident,src,msg in sorted(set(lint_rows)): print(f"- [{ident}] `{src}` — {msg}")
          else: print("- None found in parsed XML reports, or reports unavailable.")
          print("\n## Top-level Kotlin declarations with zero/one textual mention")
          decl=[]
          for rootdir in ["app","supabase",".github","gradle"]:
            for dp,ds,fs in os.walk(rootdir):
              ds[:]=[d for d in ds if d not in {".git","build",".gradle"}]
              for fn in fs:
                if os.path.splitext(fn)[1] not in {".kt",".kts"}: continue
                p=os.path.join(dp,fn)
                try: lines=open(p,encoding="utf-8").read().splitlines()
                except Exception: continue
                depth=0
                for i,line in enumerate(lines,1):
                  if depth==0 and re.match(r'^\s*(?:(?:public|private|internal|protected|inline|suspend|tailrec|operator|infix|override|actual|expect|data|sealed|enum|annotation|value|open|abstract|final|external)\s+)*(?:class|object|interface|fun)\s+[A-Za-z_][A-Za-z0-9_]*',line):
                    m=re.search(r'\b(class|object|interface|fun)\s+([A-Za-z_][A-Za-z0-9_]*)',line)
                    if m: decl.append((m.group(2),p,i,m.group(1)))
                  depth=max(0,depth+line.count("{")-line.count("}"))
          files=[]; basename_refs=collections.Counter()
          for dp,ds,fs in os.walk("."):
            ds[:]=[d for d in ds if d not in {".git",".gradle","build"}]
            for fn in fs:
              p=os.path.join(dp,fn)
              try:
                if os.path.getsize(p)>3000000: continue
                txt=open(p,encoding="utf-8",errors="ignore").read()
                files.append((p,txt,os.path.getsize(p)))
              except Exception: continue
          corpus="\n".join(t for _,t,_ in files)
          mentions=collections.Counter(re.findall(r"\b[A-Za-z_][A-Za-z0-9_]*\b",corpus))
          z=[]
          for name,path,line,kind in decl:
            n=mentions[name]
            if n<=1: z.append((name,path,line,kind,n))
          print(f"- Declarations parsed: {len(decl)}; zero/one-mention candidates: {len(z)}")
          for name,path,line,kind,n in sorted(z): print(f"- `{path}:{line}` {kind} `{name}` (mentions={n})")
          print("\n## Unreferenced-file candidates")
          candidates=[]
          for p,txt,size in files:
            if not p.startswith("./app/src/"): continue
            base=os.path.splitext(os.path.basename(p))[0]
            if len(base)>3 and mentions[base]<=1:
              candidates.append(p)
          print(f"- Candidate count: {len(candidates)}")
          for p in sorted(candidates): print(f"- `{p}`")
          print("\n## Large files (>= 1 MB)")
          large=[(size,p) for p,_,size in files if size>=1000000]
          print(f"- Count: {len(large)}")
          for size,p in sorted(large,reverse=True): print(f"- {size} bytes — `{p}`")
          print("\n## Exact duplicate files (SHA-256)")
          hashes=collections.defaultdict(list)
          for p,_,_ in files:
            try:
              with open(p,"rb") as f: hashes[hashlib.sha256(f.read()).hexdigest()].append(p)
            except Exception: pass
          dup=[(h,ps) for h,ps in hashes.items() if len(ps)>1]
          print(f"- Duplicate groups: {len(dup)}")
          for h,ps in sorted(dup):
            print(f"- SHA-256 `{h}`: "+", ".join(f"`{p}`" for p in sorted(ps)))
          print("\n## Limitations")
          print("- Reference counts are lexical heuristics; reflection, dependency injection, generated code, manifests, resources, and dynamic names can make apparent zero-reference candidates live.")
          print("- Unreferenced-file candidates use filename mentions only and require manual verification.")
          PY
      - name: Commit scan results to audit branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-audit/scan-results.md
          if git diff --cached --quiet; then
            echo "No scan-results change to commit."
          else
            git commit -m "audit scan results [skip ci]"
            git push origin HEAD:audit/release-readiness-2026-10-25
          fi
