name: CI smoke test

on:
  push:
    branches:
      - ci-smoke-test

permissions:
  contents: read

jobs:
  plain:
    name: plain
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo hello

  checkout:
    name: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Say hello
        run: echo hello
