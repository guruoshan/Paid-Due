name: SQL Behavioral Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-behavioral-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sql-behavioral-gate:
    name: SQL Behavioral Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check retired cashier function inventory and staged SQL warnings
        run: python3 scripts/check_retired_functions.py

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Prepare isolated Supabase CLI project without app migrations
        run: |
          mkdir -p /tmp/supabase-sql-gate/supabase/migrations
          cat > /tmp/supabase-sql-gate/supabase/config.toml <<'EOF'
          project_id = "paid-due-sql-gate"

          [db.seed]
          enabled = false
          EOF

      - name: Start disposable local Supabase stack
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --workdir /tmp/supabase-sql-gate

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create isolated test schema and install baseline function
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/cashier_financial_contract_schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/rollback/20261011140000_align_cashier_financial_contract.sql
          psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT pg_get_functiondef('public.ingest_cashier_financial_envelope(text,text,text,text,text,text,integer,timestamp with time zone,text,date,text,text,jsonb)'::regprocedure)" > /tmp/cashier-baseline.sql

      - name: Apply migration under test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261011211328_align_cashier_financial_contract.sql

      - name: Execute eight behavioral cases
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/20261011140000_cashier_financial_behavior.sql

      - name: Apply rollback and compare exact function definition
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/rollback/20261011140000_align_cashier_financial_contract.sql
          psql "$TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "SELECT pg_get_functiondef('public.ingest_cashier_financial_envelope(text,text,text,text,text,text,integer,timestamp with time zone,text,date,text,text,jsonb)'::regprocedure)" > /tmp/cashier-after-rollback.sql
          diff -u /tmp/cashier-baseline.sql /tmp/cashier-after-rollback.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/20261011140000_rollback_contract_test.sql
          echo "PASS: migration rollback exactly matches pre-migration function definition"

      - name: Run ADMIN-only membership retirement contract
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Remove the legacy financial-contract test stub before asserting the
          -- retired RPC catalog; it belongs only to the earlier rollback test.
          DROP FUNCTION IF EXISTS public.ingest_cashier_financial_envelope(text,text,text,text,text,text,integer,timestamptz,text,date,text,text,jsonb);
          DROP TABLE IF EXISTS public.business_memberships CASCADE;
          CREATE SCHEMA IF NOT EXISTS private;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY
          );
          CREATE TABLE IF NOT EXISTS public.businesses (
            id text PRIMARY KEY
          );
          CREATE TABLE public.business_memberships (
            id text PRIMARY KEY,
            business_id text NOT NULL REFERENCES public.businesses(id),
            branch_id text NOT NULL,
            role text NOT NULL,
            auth_user_id uuid REFERENCES auth.users(id),
            staff_identity_id uuid,
            is_active boolean NOT NULL DEFAULT false,
            removed_at timestamptz,
            can_create_sale boolean NOT NULL DEFAULT false,
            can_accept_cash boolean NOT NULL DEFAULT false,
            can_accept_online boolean NOT NULL DEFAULT false,
            can_create_credit_sale boolean NOT NULL DEFAULT false,
            can_use_coupon boolean NOT NULL DEFAULT false,
            can_issue_invoice boolean NOT NULL DEFAULT false,
            can_issue_receipt boolean NOT NULL DEFAULT false,
            can_refund boolean NOT NULL DEFAULT false,
            can_void boolean NOT NULL DEFAULT false,
            can_correct_amount boolean NOT NULL DEFAULT false,
            can_change_payment_method boolean NOT NULL DEFAULT false,
            can_view_broad_history boolean NOT NULL DEFAULT false,
            can_manage_products boolean NOT NULL DEFAULT false,
            can_view_reports boolean NOT NULL DEFAULT false,
            can_create_expense boolean NOT NULL DEFAULT false,
            can_view_customer_directory boolean NOT NULL DEFAULT false,
            CONSTRAINT business_memberships_principal_role_check CHECK (
              (role = 'ADMIN' AND auth_user_id IS NOT NULL AND staff_identity_id IS NULL)
              OR (role = 'CASHIER' AND auth_user_id IS NULL AND (
                staff_identity_id IS NOT NULL
                OR (staff_identity_id IS NULL AND is_active = false AND removed_at IS NOT NULL)
              ))
            )
          );
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261029010000_enforce_admin_only_role.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/20261029010000_admin_only_role_contract.sql

      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup --workdir /tmp/supabase-sql-gate
