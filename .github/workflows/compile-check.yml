name: Compile Check

on:
  push:
    branches:
      - test/financial-certification-13-operation-gate

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile app and Android tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
