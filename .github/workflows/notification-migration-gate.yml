name: Notification Migration Compatibility Gate
on:
  push:
    branches:
      - notifications-migration-production-reconcile
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-migration-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  notification-migration-gate:
    name: Notification Migration Compatibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare disposable full-migration project
        run: |
          mkdir -p /tmp/supabase-notification-gate/supabase/migrations
          cp supabase/config.toml /tmp/supabase-notification-gate/supabase/config.toml
          cp supabase/migrations/*.sql /tmp/supabase-notification-gate/supabase/migrations/
          cat >> /tmp/supabase-notification-gate/supabase/config.toml <<'EOF'

          [db.seed]
          enabled = false
          EOF
      - name: Start disposable Supabase PostgreSQL
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --workdir /tmp/supabase-notification-gate
      - name: Apply complete migration chain
        run: supabase db reset --workdir /tmp/supabase-notification-gate
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify notification behavior and financial guards
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/20261012120000_notification_contract.sql
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup --workdir /tmp/supabase-notification-gate
