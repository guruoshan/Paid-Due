name: Notification Migration Compatibility Gate
on:
  push:
    branches:
      - main
      - notifications-migration-production-reconcile
      - fix/supabase-live-source-reconciliation
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-migration-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  notification-migration-gate:
    name: Notification Migration Compatibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Supabase CLI
        id: setup-supabase-cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Prepare isolated Supabase CLI project
        run: |
          mkdir -p /tmp/supabase-notification-gate/supabase/migrations
          cat > /tmp/supabase-notification-gate/supabase/config.toml <<'EOF'
          project_id = "paid-due-notification-gate"

          [db.seed]
          enabled = false
          EOF
      - name: Start disposable Supabase PostgreSQL
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --workdir /tmp/supabase-notification-gate
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Report disposable PostgreSQL version
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'SHOW server_version; SELECT version();'
      - name: Build disposable baseline schema
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/cashier_financial_contract_schema.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/notification_contract_schema.sql
      - name: Apply financial contract first, then notification migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261011211328_align_cashier_financial_contract.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261011230317_business_notifications_and_permission_requests.sql
      - name: Verify notification behavior and preserved financial guards
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/20261012120000_notification_contract.sql
      - name: Apply customer-directory and release-blocker migrations in isolation
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          # This baseline gate intentionally omits the staff-invitation migration chain.
          # Add only the existing relation shape required to compile the restoration RPC.
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE TABLE private.staff_invite_activations (membership_id text, staff_identity_id uuid, local_user_id text)"
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261012212934_customer_directory_sync_contract.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261012212941_admin_customer_directory_sync.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261013230803_customer_directory_permission_enforcement.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261013230811_release_blocker_security_hardening.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261014150651_capture_live_function_definitions.sql
      - name: Verify release-blocker security, permission and replay behavior
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/20261013230811_release_blocker_security_hardening.sql
      - name: Verify live function source and grants before forward migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/20261014150651_live_function_source_reconciliation.sql
      - name: Apply forward financial envelope metadata consistency migration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261027193000_financial_envelope_metadata_consistency.sql
      - name: Verify financial envelope replay and metadata consistency
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/20261027193000_financial_envelope_idempotency.sql
      - name: Stop disposable Supabase
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase stop --no-backup --workdir /tmp/supabase-notification-gate
