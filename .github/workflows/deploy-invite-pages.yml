name: Deploy invitation page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "invite/**"
      - ".github/workflows/deploy-invite-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload invitation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: invite
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
