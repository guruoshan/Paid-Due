name: Financial Certification Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/test/java/com/dailymoneyregister/core/cloud/sync/FinancialCertificationCaseRegistry.kt'
      - 'app/src/test/java/com/dailymoneyregister/core/cloud/sync/FinancialCertificationCaseRegistryTest.kt'
      - 'docs/financial-certification/**'
      - '.github/workflows/financial-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-certification-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Certification registry contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run registry contract tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest --tests com.dailymoneyregister.core.cloud.sync.FinancialCertificationCaseRegistryTest
      - name: Preserve test report
        if: always() && hashFiles('app/build/test-results/testDebugUnitTest/**/*.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: financial-certification-contract-${{ github.run_id }}
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: error
          retention-days: 30
