name: Paid&Due authentication authority checks

on:
  push:
    branches:
      - auth-authority
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auth-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PAID_DUE_SUPABASE_URL: https://example.supabase.co
      PAID_DUE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Debug Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Run Debug unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run all API Deno tests
        working-directory: supabase/functions/api
        run: deno task test
