name: Paid&Due authentication authority checks

on:
  push:
    branches:
      - auth-authority
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auth-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PAID_DUE_SUPABASE_URL: https://example.supabase.co
      PAID_DUE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_test_only
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install available Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure runner-compatible SDK for verification only
        run: |
          # The hosted SDK repository currently offers API 36, while this app and
          # SQLCipher metadata declare API 37. This is diagnostic source validation;
          # it does not edit tracked files or certify a production API 37 build.
          sed -i 's/version = release(37)/version = release(36)/; s/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          chmod +x ./gradlew
      - name: Compile Debug Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin -x :app:checkDebugAarMetadata
      - name: Run Debug unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest -x :app:checkDebugAarMetadata
      - name: Assemble Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug -x :app:checkDebugAarMetadata
      - name: Compile Debug Android instrumentation tests
        run: ./gradlew --no-daemon :app:compileDebugAndroidTestKotlin -x :app:checkDebugAarMetadata

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run API Deno tests
        working-directory: supabase/functions/api
        run: deno task test
