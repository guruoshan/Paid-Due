name: Paid&Due authentication authority checks

on:
  push:
    branches:
      - auth-integration-selective-api37-20261012
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auth-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PAID_DUE_SUPABASE_URL: https://example.supabase.co
      PAID_DUE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_test_only
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install production Android SDK platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E 'platforms;android-37\.0|build-tools;37\.0\.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify production SDK configuration
        run: |
          chmod +x ./gradlew
          grep -q 'version = release(37)' app/build.gradle.kts
          grep -q 'targetSdk = 37' app/build.gradle.kts
      - name: Validate Android AAR metadata
        run: ./gradlew --no-daemon :app:checkDebugAarMetadata
      - name: Compile Debug Kotlin
        run: ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Run Debug unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Compile Debug Android instrumentation tests
        run: ./gradlew --no-daemon :app:compileDebugAndroidTestKotlin

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run API Deno tests
        working-directory: supabase/functions/api
        run: deno task test
