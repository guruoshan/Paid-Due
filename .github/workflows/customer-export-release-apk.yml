name: Customer export release APK build

on:
  push:
    branches: [feature/customer-excel-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PAID_DUE_APPLY_INBOUND_FINANCIAL_ENVELOPES: "true"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/customer-excel-export
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
      - name: Run ./gradlew clean
        run: ./gradlew clean
      - name: Run ./gradlew assembleRelease
        run: ./gradlew assembleRelease
      - name: Record APK path and size
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" && test -s "$apk_path"
          printf 'APK_PATH=%s\n' "$apk_path" >> "$GITHUB_ENV"
          stat -c 'APK_SIZE_BYTES=%s' "$apk_path" | tee -a "$GITHUB_ENV"
          sha256sum "$apk_path"
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-export-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
