<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Paid&amp;Due invitation</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    main { width: min(440px, 100%); padding: 28px; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px #00000012; text-align: center; }
    h1 { margin-top: 0; }
    p { line-height: 1.5; color: #555; }
    #open { display: block; padding: 14px 18px; margin-top: 20px; border-radius: 12px; background: #171717; color: #fff; text-decoration: none; font-weight: 650; }
    #open:focus-visible { outline: 3px solid #64748b; outline-offset: 3px; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Paid&amp;Due</h1>
    <p id="message">Checking your invitation…</p>
    <a id="open" href="#" hidden>Open Paid&amp;Due</a>
    <p id="status" aria-live="polite">Tap the button to continue in the app.</p>
    <p>Invitations expire after 48 hours and can be used once. Expired or already-used invitations cannot activate a cashier account.</p>
    <p>If Paid&amp;Due is not installed, install it and open this invitation link again.</p>
  </main>
  <script>
    (() => {
      // The token is deliberately kept in the URL fragment. Browsers do not send
      // fragments to the web server, and this page makes no network requests.
      const token = window.location.hash.replace(/^#/, "").trim();
      const message = document.getElementById("message");
      const button = document.getElementById("open");
      const status = document.getElementById("status");

      if (!/^[A-Za-z0-9_-]{32,128}$/.test(token)) {
        message.textContent = "This invitation link is invalid or incomplete. Ask your administrator for a new link.";
        status.textContent = "";
        return;
      }

      button.href = "paiddue://invite?t=" + encodeURIComponent(token);
      button.hidden = false;
      message.textContent = "Your administrator invited you to join Paid&Due.";
      status.textContent = "Tap Open Paid&Due to create your six-digit PIN.";
      button.addEventListener("click", () => {
        status.textContent = "Opening Paid&Due…";
      });
    })();
  </script>
</body>
</html>
