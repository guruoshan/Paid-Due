<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Paid&amp;Due Staff Invitation</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f7f7;
      color: #151515;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: min(430px, calc(100% - 40px));
      box-sizing: border-box;
      padding: 32px;
      border-radius: 18px;
      background: #fff;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      line-height: 1.55;
      color: #555;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px 18px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    #message {
      min-height: 24px;
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <main>

    <h1>Paid&amp;Due</h1>

    <p>
      You've been invited to join a business on Paid&amp;Due.
    </p>

    <button
      id="openButton"
      type="button"
    >
      Open Paid&amp;Due
    </button>

    <p id="message"></p>

  </main>

  <script>
    const TOKEN_REGEX =
      /^[A-Za-z0-9_-]{32,128}$/;

    const button =
      document.getElementById(
        "openButton",
      );

    const message =
      document.getElementById(
        "message",
      );

    const token =
      window.location.hash
        .replace(
          /^#/,
          "",
        )
        .trim();

    if (
      !TOKEN_REGEX.test(
        token,
      )
    ) {

      button.disabled =
        true;

      message.textContent =
        "This invitation link is invalid.";

    }
    else {

      button.addEventListener(
        "click",

        () => {

          const deepLink =
            "paiddue://invite?t=" +
            encodeURIComponent(
              token,
            );

          window.location.href =
            deepLink;

          window.setTimeout(
            () => {

              message.textContent =
                "If Paid&Due did not open, install the app and open this invitation again.";

            },

            1400,
          );
        },
      );
    }
  </script>

</body>

</html>
